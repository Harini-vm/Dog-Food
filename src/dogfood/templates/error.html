{% extends "base.html" %}{% block title %}{{ status }}{% endblock %}
{% block body %}
<div class="card" style="max-width:560px;margin:2rem auto"><h1>{{ {403: 'Not allowed', 404: 'Not found'}.get(status, 'Something went wrong') }}</h1>
<p>{{ message }}</p><p class="muted"><code>{{ status }} {{ code }}</code></p><a class="btn" href="/">Home</a></div>
{% endblock %}
