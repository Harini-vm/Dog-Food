{% extends "base.html" %}{% block title %}Sign up{% endblock %}
{% block body %}
<form class="card" method="post" action="/signup" style="max-width:420px;margin:2rem auto">
  <h1>Create an account</h1>
  {% if error %}<div class="note bad" role="alert">{{ error }}</div>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="n">Name</label><input id="n" name="name" autocomplete="name" required maxlength="80" value="{{ name or '' }}">
  <label for="e">Email</label><input id="e" name="email" type="email" autocomplete="email" required value="{{ email or '' }}">
  <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="new-password" minlength="8" required>
  <small>At least 8 characters.</small>
  <div class="actions"><button class="btn primary" type="submit">Sign up</button></div>
  <p class="muted">Already registered? <a href="/login?next={{ next|urlencode }}">Log in</a></p>
</form>
{% endblock %}
